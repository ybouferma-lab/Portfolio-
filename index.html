<style>
:root{--bg:#F4F6FB;--fg:#101C33;--mut:#51607A;--card:#fff;--line:#D9E0EC;--acc:#2A5BD7;--acc2:#E6ECFB;--sun:#F0A91E;--on:#fff;
--fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif}
[data-theme=dark]{--bg:#0C1424;--fg:#E9EEF8;--mut:#9AA9C4;--card:#131D33;--line:#243150;--acc:#7EA2FF;--acc2:#17234A;--sun:#F4B941;--on:#0C1424}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.7 var(--fb)}
.w{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.1}
a{color:inherit}button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nb{display:flex;align-items:center;gap:18px;height:60px}
.br{font:800 1.25rem var(--fd);text-decoration:none}
.lk{display:flex;gap:6px;margin-inline-start:auto}
.lk a{text-decoration:none;color:var(--mut);font-size:.92rem;font-weight:500;padding:6px 12px;border-radius:99px}
.lk a:hover{color:var(--fg)}.lk a.on{background:var(--acc2);color:var(--acc);font-weight:600}
.tl{display:flex;gap:8px;align-items:center}
#pc{font-size:.8rem;font-weight:600;color:var(--acc);min-width:2.6em;text-align:center}
.lg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lg button{background:none;border:0;color:var(--fg);padding:6px 11px;font-size:.8rem;font-weight:600}
.lg .on{background:var(--acc);color:var(--on)}
#th,#bg{background:none;border:1px solid var(--line);color:var(--fg);border-radius:99px;width:34px;height:34px}
#bg{display:none}
.ico{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:99px;color:var(--fg)}
.ico:hover{color:var(--acc);border-color:var(--acc)}.ico svg{width:16px;height:16px;fill:currentColor}
.soc{display:flex;gap:14px}.ico.big{width:56px;height:56px;margin-top:6px}.ico.big svg{width:24px;height:24px}
#pg{height:3px;background:var(--line)}#pg i{display:block;height:100%;width:0;background:var(--sun)}
.hero{position:relative;padding:64px 0 56px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%);opacity:.7}
.hg{position:relative;display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:center}
h1{font-size:clamp(3rem,10vw,6.4rem);font-weight:800;letter-spacing:-.03em;line-height:.95}
h1 span{display:block;animation:up .9s cubic-bezier(.2,.7,.2,1) both}h1 span+span{animation-delay:.12s;color:var(--acc)}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
.role{font:600 1.35rem var(--fd);margin:22px 0 10px}
.lead{color:var(--mut);font-size:1.08rem;max-width:540px;margin:0}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.b{display:inline-block;background:var(--acc);color:var(--on);border:2px solid var(--acc);border-radius:8px;padding:10px 20px;font-weight:600;text-decoration:none;font-size:.95rem}
.b:hover{filter:brightness(1.1)}.gh{background:none;color:var(--acc)}
.wk{font-size:.9rem;color:var(--mut)}.wk b{color:var(--fg);font-weight:600;margin-inline-end:16px}
.fr{position:relative;justify-self:center;width:min(330px,80%);padding:12px}
.fr:before,.fr:after{content:"";position:absolute;width:44px;height:44px;border:3px solid var(--sun)}
.fr:before{top:0;inset-inline-start:0;border-width:3px 0 0 3px}.fr:after{bottom:0;inset-inline-end:0;border-width:0 3px 3px 0}
.fr img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
section{padding-top:72px}
.sh{display:flex;align-items:baseline;gap:20px;border-top:2px solid var(--fg);padding-top:14px;margin-bottom:8px}
h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 4px;max-width:620px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:5px 16px;border-radius:99px;font-size:.88rem}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc)}
.th{position:relative;height:130px;display:flex;align-items:flex-end;padding:14px 18px;font:800 1.7rem var(--fd);letter-spacing:-.02em;color:#fff;background:var(--acc)}
.th.s{background:var(--sun);color:#101C33}.th.v{background:#101C33}.th.m{background:#0F7A6B}
.th i{position:absolute;top:14px;inset-inline-end:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:.8rem}
.cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{font-size:1.2rem}.cb p{margin:0;flex:1;color:var(--mut);font-size:.94rem}
.meta{font-size:.82rem;color:var(--mut);font-weight:500}
.tag{display:inline-block;border:1px solid var(--line);font-size:.76rem;font-weight:500;padding:1px 9px;border-radius:4px;margin-inline-end:6px}
.cb .b{align-self:flex-start;margin-top:6px}
.ct{padding-bottom:80px}.ct p{color:var(--mut);margin:12px 0 18px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--mut);font-size:.85rem}
#md{position:fixed;inset:0;background:rgba(5,10,20,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}#md.open{display:flex}
.bx{background:var(--card);border-radius:14px;width:min(1040px,100%);height:min(88vh,740px);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.bar strong{flex:1}.bar .b{padding:5px 12px;font-size:.85rem}
#tk{font-size:.8rem;font-weight:600;color:var(--acc);background:var(--acc2);padding:6px 14px}
#fr{flex:1;border:0;width:100%;background:#fff}#em{padding:28px;color:var(--mut)}
@media(max-width:780px){.hg{grid-template-columns:1fr}.fr{order:-1;width:min(240px,70%)}
.lk{display:none;position:absolute;inset-inline:0;top:60px;flex-direction:column;background:var(--bg);padding:12px 22px;border-bottom:1px solid var(--line)}
nav.open .lk{display:flex}#bg{display:block}.br{margin-inline-end:auto}.lk{margin:0}}
@media(prefers-reduced-motion:reduce){h1 span{animation:none}html{scroll-behavior:auto}}

const PR=[

{k:"Simulation",o:"RCCE",g:["RCCE","Humanitaire"],t:["Eldria","Eldria"],d:["Simulation d'une épidémie fictive pour former des professionnels de l'humanitaire.","Fictional outbreak simulation to train humanitarian professionals."],url:""}];

let L=0,F="*",last;
const t=a=>Array.isArray(a)?a[L]:a;

 $('#ch').innerHTML=["*",...Object.keys(TL)].map(k=>`<button class="chip${k===F?' on':''}" data-k="${k}">${k==="*"?t(S.all):t(TL[k])}</button>`).join('');
 $('#gr').innerHTML=PR.map((p,i)=>p.k===F||F==="*"?`<article class="card"><div class="th ${CL[p.k]}">${t(TL[p.k])}${p.url?'<i>▶</i>':''}</div><div class="cb"><div class="meta">${p.o}</div><h3>${t(p.t)}</h3><p>${t(p.d)}</p><div>${p.g.map(x=>`<span class="tag">${x}</span>`).join('')}</div><button class="b" data-p="${i}">${p.k==="Course"?t(S.run):t(S.view)}</button></div></article>`:'').join('')||`<p class="sub">${t(S.empty)}</p>`;}
function setL(i){L=i;const d=document.documentElement;d.lang=["fr","en"][i];
 $$('[data-i]').forEach(e=>e.textContent=S[e.dataset.i][i]);
 $$('.lg button').forEach(b=>b.classList.toggle('on',+b.dataset.l===i));rp();
 try{localStorage.setItem('lg',i)}catch(e){}}
$$('.lg button').forEach(b=>b.onclick=()=>setL(+b.dataset.l));

$('#gr').onclick=e=>{const b=e.target.closest('[data-p]');if(b)op(PR[+b.dataset.p],b)};

let cmi={};
function upd(){const g=k=>cmi[k];$('#tk').textContent=t(S.tr)+" : "+(g('cmi.core.lesson_status')||g('cmi.completion_status')||"—")+"  |  "+t(S.sc)+" : "+(g('cmi.core.score.raw')||g('cmi.score.raw')||"—")}
const ok=()=>"true",z=()=>"0",e0=()=>"",gv=k=>cmi[k]||"",sv=(k,v)=>{cmi[k]=v;upd();return"true"};
window.API={LMSInitialize:ok,LMSFinish:ok,LMSGetValue:gv,LMSSetValue:sv,LMSCommit:ok,LMSGetLastError:z,LMSGetErrorString:e0,LMSGetDiagnostic:e0};
window.API_1484_11={Initialize:ok,Terminate:ok,GetValue:gv,SetValue:sv,Commit:ok,GetLastError:z,GetErrorString:e0,GetDiagnostic:e0};
function op(p,b){last=b;cmi={};$('#mt').textContent=t(p.t);const f=$('#fr'),m=$('#em');f.removeAttribute('src');
 if(p.url){f.hidden=false;m.hidden=true;f.src=p.url}else{f.hidden=true;m.hidden=false;m.textContent=t(S.soon)}
 $('#tk').hidden=!(p.k==="Course"&&p.url);upd();$('#md').classList.add('open');document.body.style.overflow="hidden";$('#cl').focus()}
function cl(){$('#md').classList.remove('open');$('#fr').removeAttribute('src');document.body.style.overflow="";if(last)last.focus()}
$('#cl').onclick=cl;$('#md').onclick=e=>{if(e.target.id==="md")cl()};
$('#fs').onclick=()=>{const f=$('#fr');(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
addEventListener('keydown',e=>{if(e.key==="Escape")cl()});

/* Thème, menu, progression de lecture (comme dans un cours en ligne) */
function setT(d){document.documentElement.dataset.theme=d?"dark":"light";try{localStorage.setItem('th',d?1:0)}catch(e){}}

setT(st!=null?st==="1":matchMedia('(prefers-color-scheme:dark)').matches);
$('#th').onclick=()=>setT(document.documentElement.dataset.theme!=="dark");
$('#bg').onclick=()=>$('#nv').classList.toggle('open');$$('.lk a').forEach(a=>a.onclick=()=>$('#nv').classList.remove('open'));
const sec=[...$$('main section')];
function sp(){const h=document.documentElement,p=Math.min(1,h.scrollTop/(h.scrollHeight-h.clientHeight||1));
 $('#pg i').style.width=p*100+"%";$('#pc').textContent=p>.98?"✓":Math.round(p*100)+"%";
 let c="";sec.forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)c=s.id});
 $$('.lk a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==="#"+c))}
addEventListener('scroll',sp,{passive:true});
